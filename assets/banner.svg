<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M60 0 V420 M120 0 V420 M180 0 V420 M240 0 V420 M300 0 V420 M360 0 V420 M420 0 V420 M480 0 V420 M540 0 V420 M600 0 V420 M660 0 V420 M720 0 V420 M780 0 V420 M840 0 V420 M900 0 V420 M960 0 V420 M1020 0 V420 M1080 0 V420 M1140 0 V420" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Atmospheric Light Orbs -->
  <circle cx="200" cy="80" r="280" fill="url(#cyan-glow)" filter="blur(40px)" />
  <circle cx="1050" cy="340" r="240" fill="#6366F1" fill-opacity="0.12" filter="blur(50px)" />

  <!-- Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1E293B" stroke-width="2" />
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#title-grad)" />

  <!-- Badge / Pill Tag -->
  <g transform="translate(80, 68)">
    <rect width="250" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="16" r="5" fill="#38BDF8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="0.5">OPEN-SOURCE UTILITY v2.0</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#title-grad)" letter-spacing="-1">
    Windows Deep Cleaner
  </text>

  <!-- Subtitle -->
  <text x="80" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    High-Performance Disk Cleanup &amp; System Optimization Suite for Windows 10 &amp; 11
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 260)">
    <!-- Pill 1: Prefetch & Temp -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#1E293B" />
    <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">⚡ Prefetch &amp; Temp</text>

    <!-- Pill 2: Settings Temp Files -->
    <rect x="175" y="0" width="180" height="36" rx="8" fill="#1E293B" />
    <text x="193" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">⚙️ Windows Settings</text>

    <!-- Pill 3: Recent & JumpLists -->
    <rect x="370" y="0" width="175" height="36" rx="8" fill="#1E293B" />
    <text x="388" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">🕒 Recent Files Wipe</text>

    <!-- Pill 4: Recycle Bin -->
    <rect x="560" y="0" width="155" height="36" rx="8" fill="#1E293B" />
    <text x="578" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">🗑️ Recycle Bin Flush</text>

    <!-- Pill 5: Zero Dependencies -->
    <rect x="730" y="0" width="165" height="36" rx="8" fill="#1E293B" />
    <text x="748" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">📦 Zero Dependencies</text>
  </g>

  <!-- Author & Branding Footer inside banner -->
  <g transform="translate(80, 345)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B">
      Crafted with precision by <tspan fill="#F8FAFC" font-weight="700">Abhigyan Sati</tspan> • Free &amp; Open Source under MIT
    </text>
  </g>

  <!-- Terminal Preview Graphic Mockup on Right -->
  <g transform="translate(930, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="1.5" />
    <!-- Terminal Titlebar -->
    <rect width="200" height="28" rx="12" fill="#1E293B" />
    <circle cx="18" cy="14" r="4.5" fill="#EF4444" />
    <circle cx="32" cy="14" r="4.5" fill="#F59E0B" />
    <circle cx="46" cy="14" r="4.5" fill="#10B981" />
    <text x="75" y="18" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">cmd.exe</text>

    <!-- Simulated CLI Text -->
    <text x="14" y="55" font-family="Consolas, monospace" font-size="11" fill="#38BDF8">&gt; deepclean /auto</text>
    <text x="14" y="80" font-family="Consolas, monospace" font-size="10" fill="#10B981">[*] Free: 42.1 GB</text>
    <text x="14" y="105" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">[+] Wiping Temp...</text>
    <text x="14" y="130" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">[+] Prefetch Purged</text>
    <text x="14" y="155" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">[+] Recent Files OK</text>
    <text x="14" y="180" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">[+] Emptying Bin...</text>
    <text x="14" y="210" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#38BDF8">[+] Freed: +8.4 GB!</text>
    <text x="14" y="232" font-family="Consolas, monospace" font-size="10" fill="#10B981">DONE [100%]</text>
  </g>
</svg>
