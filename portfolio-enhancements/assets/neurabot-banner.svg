    <rect x="340" y="0" width="170" height="34" rx="8" fill="#2B134E" stroke="#581C87" stroke-width="1" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F3E8FF">🧠 Pattern Matching</text>

