<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neura-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140A26" />
      <stop offset="50%" stop-color="#241142" />
      <stop offset="100%" stop-color="#0A0514" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#neura-bg)" />
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#3B1D6B" stroke-width="2" />
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#purple-grad)" />

  <g transform="translate(80, 60)">
    <rect width="260" height="30" rx="15" fill="#2E1256" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5" />
