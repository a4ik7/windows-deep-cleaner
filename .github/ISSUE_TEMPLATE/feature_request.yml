name: 🚀 Feature Request
description: Suggest an enhancement or new cache location to purge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Windows Deep Cleaner even better? Tell us!

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: What cache, directory, or CLI flag would you like to see added?
      placeholder: "e.g., Add support for cleaning Spotify offline streaming cache"
    validations:
      required: true

  - type: textarea
    id: target_path
    attributes:
      label: Target Path / Registry Key
      description: If proposing a new cache location, specify the exact filesystem path or registry key.
      placeholder: "%LocalAppData%\\Spotify\\Storage"

  - type: textarea
    id: safety_rationale
    attributes:
      label: Safety & Impact Rationale
      description: Why is this cache completely safe to wipe? How much space does it typically save?
      placeholder: "Spotify will regenerate it automatically on streaming without losing account login..."
    validations:
      required: true
